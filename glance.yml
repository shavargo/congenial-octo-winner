theme:
  background-color: 50 1 6
  primary-color: 24 97 58
  negative-color: 209 88 54

branding:
  hide-footer: false

pages:
  - name: Home
    hide-desktop-navigation: true
    show-mobile-header: false
    columns:
      - size: small
        widgets:

          - type: weather
            location: ${GEO_LOC}
            units: imperial
            hour-format: 12h
            hide-location: true

          - type: twitch-channels
            channels:
              - piratesoftware
              - theburntpeanut
              - lvndmark
              - stankrat

      - size: full
        widgets:
          - type: search
            search-engine: google
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}

              - title: Reddit
                shortcut: "!red"
                url: https://www.reddit.com/search?q={QUERY}

              - title: Steam
                shortcut: "!steam"
                url: https://store.steampowered.com/search/?term={QUERY}

              - title: Amazon
                shortcut: "!amazon"
                url: https://www.amazon.com/s?k={QUERY}

              - title: Ebay
                shortcut: "!ebay"
                url: https://www.ebay.com/sch/i.html?_nkw={QUERY}

              - title: Wallhaven
                shortcut: "!wh"
                url: https://wallhaven.cc/search?q={QUERY}

              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}

              - title: Docker Hub
                shortcut: "!dh"
                url: https://hub.docker.com/search?q={QUERY}

              - title: MDN Docs
                shortcut: "!mdn"
                url: https://developer.mozilla.org/en-US/search?q={QUERY}

          - type: html
            title: Search Bangs
            source: |
              <div style="display: flex; gap: 1rem; font-size: 1.5rem;">
                <table style="flex: 1; border-collapse: collapse;">
                  <tbody>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!yt</td><td style="padding: 3px 8px;">YouTube</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!red</td><td style="padding: 3px 8px;">Reddit</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!steam</td><td style="padding: 3px 8px;">Steam</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!amazon</td><td style="padding: 3px 8px;">Amazon</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!ebay</td><td style="padding: 3px 8px;">eBay</td></tr>
                  </tbody>
                </table>
                <table style="flex: 1; border-collapse: collapse;">
                  <tbody>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!wh</td><td style="padding: 3px 8px;">Wallhaven</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!gh</td><td style="padding: 3px 8px;">GitHub</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!dh</td><td style="padding: 3px 8px;">Docker Hub</td></tr>
                    <tr><td class="color-primary" style="padding: 3px 8px;">!mdn</td><td style="padding: 3px 8px;">MDN Docs</td></tr>
                  </tbody>
                </table>
              </div>

          - type: rss
            title: Tech News
            collapse-after: 5
            feeds:
              - url: https://www.xda-developers.com/feed/
                title: XDA Developers
              - url: https://feeds.arstechnica.com/arstechnica/index
                title: Ars Technica
              - url: https://www.theverge.com/rss/index.xml
                title: The Verge
              - url: https://www.tomshardware.com/feeds/all
                title: Tom's Hardware
              - url: https://www.engadget.com/rss.xml
                title: Engadget
              - url: https://www.wired.com/feed/rss
                title: Wired
              - url: https://dev.to/feed
                title: Dev.to
              - url: https://lobste.rs/rss
                title: Lobsters
              - url: https://krebsonsecurity.com/feed/
                title: Krebs on Security
              - url: https://feeds.feedburner.com/TheHackersNews
                title: The Hacker News

          - type: monitor
            title: My Domains
            sites:
              - title: backwoodswebsolutions.com
                url: https://backwoodswebsolutions.com
              - title: deepwoods.app
                url: https://deepwoods.app
              - title: sectorfourgaming.com
                url: https://sectorfourgaming.com
              - title: shavargo.com
                url: https://shavargo.com

          - type: monitor
            title: Managed Domains
            sites:
              - title: kofc12038.com
                url: https://kofc12038.com
              - title: cleanitupjunkremoval.com
                url: https://www.cleanitupjunkremoval.com

      - size: small
        widgets:
          - type: markets
            title: My Stocks
            markets:
              - symbol: MU
                name: Micron Technology
              - symbol: NVDA
                name: NVIDIA
              - symbol: YYGH
                name: YY Group
              - symbol: GOOG
                name: Alphabet
              - symbol: SPY
                name: S&P 500 ETF
              - symbol: TSM
                name: TSMC

          - type: releases
            token: ${GIT_TOKEN}
            collapse-after: -1
            show-source-icon: true
            repositories:
              - glanceapp/glance
              - louislam/dockge
              - AnalogJ/scrutiny
              - crazy-max/diun
              - home-assistant/core